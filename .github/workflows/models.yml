name: models

# Smoke-test every macro-lab model on a clean checkout: uv sync, then run each
# model script. Fails the build if any model errors — proof the whole stack
# reproduces from pyproject/uv.lock alone. Auto-discovers scripts, so new
# country modules (europe/, china/, …) are picked up without editing this file.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: informal_economy_ai_bitcoin/debt_cycle
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (from uv.lock)
        run: uv sync --frozen || uv sync

      - name: Run every model
        run: |
          set -e
          shopt -s nullglob
          fail=0
          for f in *.py */*.py; do
            echo "::group::$f"
            if uv run python "$f"; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f FAILED"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  backend-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync backend deps
        run: uv sync --frozen || uv sync
      - name: Smoke-test the API (imports + reads model data)
        run: |
          uv run python -c "import main; \
            assert main.health()['data_present'], 'model data not found'; \
            assert main.poles()['poles'], 'poles empty'; \
            assert main.macro_index()['poles'], 'index empty'; \
            assert main.development_age()['trajectories'], 'dev-age empty'; \
            print('backend ok — endpoints return live model data')"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build the dashboard
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Build both images (compose)
        run: docker compose build
